[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "registry-service"
version = "0.1.0"
description = "Microservice Registry Service pour la résolution des versions, l'analyse de sécurité OSV et le rapport LLM."
authors = [{ name = "Dependency Sentinel Team" }]
requires-python = ">=3.12"

dependencies = [
    "common",
    "events",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
common = { workspace = true }
events = { workspace = true }

[project.scripts]
registry-service = "registry_service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/registry_service"]
