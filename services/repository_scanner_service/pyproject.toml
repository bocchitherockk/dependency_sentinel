[project]
name = "repository-scanner-service"
version = "0.1.0"
description = "Repository scanner service for Dependency Sentinel"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
repository-scanner-service = "repository_scanner_service.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repository_scanner_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]