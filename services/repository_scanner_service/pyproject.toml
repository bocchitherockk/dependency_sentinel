[project]
name = "repository-scanner-service"
version = "0.1.0"
description = "Repository scanner service for Dependency Sentinel"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "common",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
]

[tool.uv.sources]
common = { workspace = true }

[project.scripts]
repository-scanner-service = "repository_scanner_service.main:main"
