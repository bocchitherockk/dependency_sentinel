[project]
name = "llm-service"
version = "0.1.0"
description = "LLM Service - the only component that talks to the LLM provider (Ollama, etc.) for Dependency Sentinel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
]

[project.scripts]
llm-service = "llm_service.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]