[project]
name = "llm-service"
version = "0.1.0"
description = "LLM Service - the only component that talks to the LLM provider (Ollama, etc.) for Dependency Sentinel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "httpx>=0.28.0",
    "google-genai>=2.14.0",
    "python-dotenv>=1.2.2",
    "fastmcp>=3.4.7",
]

[tool.uv.sources]
common = { workspace = true }

[project.scripts]
llm-service = "llm_service.__main__:main"
