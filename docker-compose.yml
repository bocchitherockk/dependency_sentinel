    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BIND_HOST: 0.0.0.0
      SCHEDULER_HOST: scheduler
      GATEWAY_HOST: gateway
      REPOSITORY_STORAGE_SERVICE_HOST: repository-storage-service
      REPOSITORY_SCANNER_SERVICE_HOST: repository-scanner-service
      LLM_SERVICE_HOST: llm-service
      REGISTRY_SERVICE_HOST: registry-service
      MCP_SERVER_HOST: mcp-server
