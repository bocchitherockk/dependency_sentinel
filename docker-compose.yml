x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  BIND_HOST: 0.0.0.0
  SCHEDULER_HOST: scheduler
  GATEWAY_HOST: gateway
  REPOSITORY_STORAGE_SERVICE_HOST: repository-storage-service
  REPOSITORY_SCANNER_SERVICE_HOST: repository-scanner-service
  LLM_SERVICE_HOST: llm-service
  REGISTRY_SERVICE_HOST: registry-service
  MCP_SERVER_HOST: mcp-server
  SECURITY_INTELLIGENCE_SERVICE_HOST: security-intelligence-service

services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      CLUSTER_ID: "1L6g7nGhU-eAKfL--X25wo"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - dependency-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"
    networks:
      - dependency-network

  scheduler:
    build: .
    container_name: scheduler
    command: ["scheduler", "scheduler"]
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - kafka

  gateway:
    build: .
    container_name: gateway
    command: ["gateway", "gateway"]
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - scheduler

  repository-storage-service:
    build: .
    container_name: repository-storage-service
    command: ["repository-storage-service", "repository-storage-service"]
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - kafka

  repository-scanner-service:
    build: .
    container_name: repository-scanner-service
    command: ["repository-scanner-service", "repository-scanner-service"]
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - kafka

  llm-service:
    build: .
    container_name: llm-service
    command: ["llm-service", "llm-service"]
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - mcp-server
      - kafka

  registry-service:
    build: .
    container_name: registry-service
    command: ["registry-service", "registry-service"]
    ports:
      - "8008:8005"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - kafka

  mcp-server:
    build: .
    container_name: mcp-server
    command: ["mcp-server", "mcp-server"]
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - kafka

  security-intelligence-service:
    build: .
    container_name: security-intelligence-service
    command: ["security-intelligence-service", "security-intelligence-service"]
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
    env_file:
      - .env
    networks:
      - dependency-network
    depends_on:
      - llm-service
      - kafka

volumes:
  kafka_data:

networks:
  dependency-network:
    driver: bridge