[project]
name = "dependency-sentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/*",
    "libs/*"
]

[tool.uv.sources]
gateway = { workspace = true }
repository-storage-service = { workspace = true }
repository_scanner_service = { workspace = true }
llm_service = { workspace = true }
registry-service = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
